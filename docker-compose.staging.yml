services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: thesis_compliance
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://thesis:${POSTGRES_PASSWORD}@db:5432/thesis_compliance
      STORAGE_ROOT: /data
      ENVIRONMENT: staging
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?Set ALLOWED_ORIGINS}
      OIDC_REQUIRED: "true"
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set OIDC_AUDIENCE}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set OIDC_JWKS_URL}
      CLAMAV_ENABLED: "true"
      MALWARE_SCAN_FAIL_CLOSED: "true"
    volumes:
      - ./storage:/data
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
