name: security-and-tests
on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  tests-and-sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt bandit pip-audit pytest
      - run: python -m compileall app
      - run: pytest -q
      - run: bandit -q -r app
      - run: pip-audit -r requirements.txt
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-and-container-scan:
    runs-on: ubuntu-latest
    needs: tests-and-sast
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
      - run: docker build -t thesis-compliance:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: thesis-compliance:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

  dast:
    runs-on: ubuntu-latest
    needs: dependency-and-container-scan
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: sleep 20
      - run: curl --fail http://localhost:8000/api/health
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          fail_action: true
      - if: always()
        run: docker compose down -v
