# Render Blueprint for a free, disposable demo deployment.
#
# This is deliberately NOT the production architecture described in
# FINAL_TECHNICAL_DOCUMENTATION.md (no real OIDC, no ClamAV, no Redis/worker
# split, no persistent storage). It's the fastest path to a working, clickable
# demo at $0/month. See PHASE1_FINDINGS.md and the chat history for the
# production roadmap.
#
# To use: push this repo (with render.yaml at the root) to GitHub, then in the
# Render Dashboard: New > Blueprint > select this repo > Deploy Blueprint.
#
# Known limitations of this configuration (all intentional trade-offs for $0):
#   - Free Postgres expires 30 days after creation (Render deletes it after a
#     14-day grace period) and is capped at 1 GB. Fine for a demo; re-create
#     the database (or move to a paid plan) if you need it longer.
#   - The web service's filesystem is ephemeral: uploaded documents are lost
#     on every redeploy or spin-down. Treat all data here as disposable.
#   - The free instance spins down after 15 minutes idle; the first request
#     after that takes ~1 minute to wake back up.
#   - 512 MB RAM. LibreOffice converting a large, image-heavy thesis may hit
#     this ceiling — if validation jobs start failing/crashing on real
#     documents, raise `plan` below from `free` to `1c-2g` (2 GB RAM, ~$25/mo).

services:
  - type: web
    name: thesis-compliance-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: development
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: "admin@demo.edu"
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: PORT
        value: "8000"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-compliance-db
          property: connectionString

databases:
  - name: thesis-compliance-db
    plan: free
